[app]
socket_name = "rpresent.sock"

[spotlight]
enabled_on_start = false
show_spot_shade = true
show_center_dot = true
dot_size_px = 8
dot_color = "#ff0000"
dot_opacity = 0.8
shade_color = "#000000"
shade_opacity = 0.95
show_border = false
border_color = "#bada55"
border_size_pct = 2
border_opacity = 0.3
wheel_speed = 60.0
softness_px = 20
radius_px = 150

[spotlight.shape]
type = "circle"

[annotation]
enabled_on_start = false
default_tool = "pen"
stroke_width_px = 6
history_depth = 64

[zoom]
enabled_on_start = false
initial_scale = 2.0
min_scale = 1.0
max_scale = 6.0
scroll_speed = 0.25
drag_friction = 6.0
scale_friction = 5.0

[shortcuts]
spotlight_mode = "Ctrl+1"
annotation_mode = "Ctrl+2"
zoom_mode = "Ctrl+3"
wheel_modifier = "Ctrl"
