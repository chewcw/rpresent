[workspace]
members = [
	"crates/rpresent-config",
	"crates/rpresent-spotlight",
	"crates/rpresent-annotation",
	"crates/rpresent-zoom",
	"crates/rpresent",
]
default-members = ["crates/rpresent"]
resolver = "2"

[workspace.package]
version = "0.2.0"

[workspace.dependencies]
tracing = "0.1"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
