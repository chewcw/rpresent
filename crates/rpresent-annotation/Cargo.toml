[package]
name = "rpresent-annotation"
version = "0.1.0"
edition = "2024"

[dependencies]
rpresent-config = { path = "../rpresent-config" }
tracing = { workspace = true }
thiserror = "2"
cosmic-text = "0.19"
crossbeam-channel = "0.5"
libc = "0.2"
tiny-skia = { version = "0.11", default-features = false, features = ["std"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["render", "image", "shape"] }
