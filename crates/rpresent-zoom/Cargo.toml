[package]
name = "rpresent-zoom"
version = "0.1.0"
edition = "2024"

[dependencies]
rpresent-config = { path = "../rpresent-config" }
tracing = { workspace = true }
thiserror = "2"
crossbeam-channel = "0.5"
x11rb = { version = "0.13", features = ["render", "image"] }
glow = "0.16"
x11 = { version = "2", features = ["glx", "xlib"] }